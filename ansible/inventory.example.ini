# Copy to inventory.ini and point at real hosts. Credentials belong in
# ansible-vault or your AWX/credential store, not in this file.

[domain_controllers]
dc01.corp.example ansible_connection=winrm ansible_winrm_transport=kerberos

[dns_servers]
dns01.corp.example ansible_connection=winrm ansible_winrm_transport=kerberos

# Infoblox and Panorama are driven through their APIs from the control node.
[infoblox]
localhost ansible_connection=local

[panorama]
localhost ansible_connection=local
