# Reserves the next free block of the requested size from the workload
# container in Infoblox (or releases it on rollback).
- name: Allocate VPC CIDR from Infoblox IPAM
  hosts: infoblox
  gather_facts: false
  vars:
    state: present
    container: 10.48.0.0/14
    nios_provider:
      host: "{{ lookup('env', 'INFOBLOX_HOST') }}"
      username: "{{ lookup('env', 'INFOBLOX_USER') }}"
      password: "{{ lookup('env', 'INFOBLOX_PASSWORD') }}"
  tasks:
    - name: Look up the next available network in the workload container
      ansible.builtin.set_fact:
        next_cidr: "{{ lookup('infoblox.nios_modules.nios_next_network', container, cidr=(cidr_size | replace('/', '') | int), provider=nios_provider) | first }}"
      when: state == 'present' and vpc_cidr is not defined

    - name: Reserve the network for this account
      infoblox.nios_modules.nios_network:
        network: "{{ vpc_cidr | default(next_cidr) }}"
        comment: "AWS {{ account_name }} ({{ request_id }})"
        extattrs:
          Owner: "{{ owners | first }}"
          Environment: "{{ environment }}"
        state: "{{ state }}"
        provider: "{{ nios_provider }}"

    - name: Return output to Temporal
      ansible.builtin.debug:
        var: temporal_output
      vars:
        temporal_output:
          vpc_cidr: "{{ vpc_cidr | default(next_cidr) }}"
